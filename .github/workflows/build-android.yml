name: Build L.Mnisi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract L.Mnisi package if needed
        shell: bash
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: android/settings.gradle was not found and no ZIP package exists."
              exit 1
            fi

            echo "Extracting package: $ZIP_FILE"
            mkdir -p .lmnisi_extract
            unzip -o "$ZIP_FILE" -d .lmnisi_extract

            if [ -f ".lmnisi_extract/android/settings.gradle" ]; then
              cp -R .lmnisi_extract/android .
            else
              ANDROID_DIR=$(find .lmnisi_extract -type f -path "*/android/settings.gradle" -print -quit | xargs -r dirname)

              if [ -z "$ANDROID_DIR" ]; then
                echo "ERROR: Android project was not found inside the ZIP."
                exit 1
              fi

              cp -R "$ANDROID_DIR" android
            fi
          fi

          echo "Android project:"
          find android -maxdepth 5 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build L.Mnisi APK
        working-directory: android
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Upload L.Mnisi APK
        uses: actions/upload-artifact@v4
        with:
          name: LMnisi-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
